name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities must NOT be reported here.** See SECURITY.md.
        Never paste real personal data, tokens or passwords.
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. POST /api/v1/...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: requestId (from the error response, if any)
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: local / staging / production, version
